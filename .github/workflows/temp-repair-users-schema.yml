name: TEMP Repair users.gender column

on:
  workflow_dispatch: {}

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Add missing gender column via trusted local socket
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          script: |
            docker exec pipeline_postgres psql -U postgres -d wardrobe -c "ALTER TABLE users ADD COLUMN IF NOT EXISTS gender VARCHAR(16);"
            docker exec pipeline_postgres psql -U postgres -d wardrobe -c "UPDATE users SET gender='women' WHERE email='demo@closettheory.local';"
            docker exec pipeline_postgres psql -U postgres -d wardrobe -c "SELECT email, gender FROM users;"
