name: Transfer playground secrets to the monorepo
# Copies this repo's deploy secrets into ClosetTheory/ClosetTheoryApp's `playground` environment,
# which the monorepo's deploy-playground.yml reads. Secret values can only be read inside a workflow,
# so this is the only way to move them without anyone handling the values.
#
# Needs one extra secret here: MONOREPO_SECRETS_TOKEN — a fine-grained personal access token scoped to
# ClosetTheory/ClosetTheoryApp only, with repository permissions Environments: read and write,
# Secrets: read and write, Metadata: read. Delete it (and revoke the token) after the transfer.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type TRANSFER PLAYGROUND SECRETS to proceed
        required: true
        type: string
permissions: {}
concurrency: { group: transfer-playground-secrets, cancel-in-progress: false }
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ inputs.confirmation == 'TRANSFER PLAYGROUND SECRETS' }}
    env:
      TARGET_REPO: ClosetTheory/ClosetTheoryApp
      TARGET_ENVIRONMENT: playground
      GH_TOKEN: ${{ secrets.MONOREPO_SECRETS_TOKEN }}
    steps:
      - name: Check the transfer token is configured
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add the MONOREPO_SECRETS_TOKEN secret first (see the header of this workflow)."
            exit 1
          fi
      - name: Copy the secrets
        env:
          APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          SPACES_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          SPACES_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          DIGITALOCEAN_PROJECT_ID: ${{ secrets.DIGITALOCEAN_PROJECT_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in APP_ENV_FILE DO_HOST DO_SSH_PRIVATE_KEY SPACES_ACCESS_KEY_ID \
                      SPACES_SECRET_ACCESS_KEY DIGITALOCEAN_TOKEN DIGITALOCEAN_PROJECT_ID; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::$name is empty in this repo; not copied."
              missing=1
              continue
            fi
            # The value goes over stdin, never on the command line.
            printf '%s' "$value" | gh secret set "$name" --repo "$TARGET_REPO" --env "$TARGET_ENVIRONMENT"
            echo "copied $name"
          done
          exit $missing
      - name: List what the target environment now holds (names only)
        run: gh secret list --repo "$TARGET_REPO" --env "$TARGET_ENVIRONMENT"
