[project]
name = "pipeline-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "prakashmohit21x@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "boto3>=1.34.0",
    "fastapi>=0.141.1",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "opencv-python-headless<5.0",
    "pgvector>=0.2.5",
    "pillow>=10.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    # The evaluation-character roster is authored as YAML (app/personas/roster.yaml). It was
    # already present transitively via uvicorn[standard]; declared here because app code now
    # imports it directly.
    "pyyaml>=6.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "uvicorn[standard]>=0.52.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
