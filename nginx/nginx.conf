server {
    listen 80;
    server_name visualiser-dsfja238un9.closettheory.co _;

    client_max_body_size 25M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name visualiser-dsfja238un9.closettheory.co;

    client_max_body_size 25M;

    ssl_certificate /etc/letsencrypt/live/visualiser-dsfja238un9.closettheory.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/visualiser-dsfja238un9.closettheory.co/privkey.pem;

    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
