      is "clean".
    rationale: >-
      The monsoon case. Eight months of heat and damp mean warmth should almost never exceed 0.4
      and leather, suede and wool are all wrong — if the engine proposes a blazer in July for her,
      it is not reading climate at all.
    assigned_stylist: stylist1

