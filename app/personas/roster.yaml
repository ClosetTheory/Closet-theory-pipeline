# Evaluation characters — the panel roster.
#
# This file is the source of truth. The database is a projection of it, rebuilt by
# `python -m scripts.seed_personas`, keyed on `slug` so re-running updates in place.
#
# It is YAML rather than Python so a stylist can read their own character, correct it
# ("nobody in Kochi owns a coat") and open a pull request — and so `rationale` can sit
# beside each entry. That field is not decoration: it names the axis this character is
# the sole carrier of, and it is what stops the roster drifting back into twenty
# variations of the same Mumbai marketer.
#
# Every entry is validated against the engine's LIVE enums by app/schemas/persona.py.
# A character declaring an occasion the styling pipeline cannot filter on fails to
# load. Add the enum value first.
#
# Coverage held deliberately: 11 women / 10 men / 1 non-binary; ages 19-62; 17 cities
# across 14 climate zones; Monk 3-9; all five female and all five male body shapes;
# 5 petite, 3 tall, 3 plus-size women, 4 heavy-set men; ethnic occasion share 0.04-0.85.
# Monk tails matter most — the failure we are hunting is colour advice tuned at Monk 4
# applied at Monk 8, where "wear pastels" and "avoid black" invert.

