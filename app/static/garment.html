<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Garment Detail</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
          colors: {
            slate: {
              50: '#ffffff', 100: '#18181b', 200: '#2b2b27', 300: '#3f3f3a',
              400: '#63635b', 500: '#84847a', 600: '#a3a39a', 700: '#c7c7be',
              800: '#e5e5e0', 900: '#f6f6f3', 950: '#fbfbf9',
            },
            ct: {
              primary: '#e60023',
              'primary-pressed': '#cc001f',
              ink: '#000000',
              'ink-soft': '#211922',
            },
          },
        },
      },
    };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ct-hairline: #dadad3;
    }
    body { font-family: 'Inter', -apple-system, system-ui, sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-ct-primary selection:text-white pb-16">

  <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex items-center justify-between gap-6">
      <a href="/" class="flex items-center space-x-3 shrink-0">
        <div class="w-9 h-9 rounded-xl bg-ct-primary flex items-center justify-center font-bold text-base text-white">CT</div>
        <div class="hidden sm:block">
          <h1 class="text-sm font-bold text-ct-ink tracking-tight leading-tight">ClosetTheory Wardrobe</h1>
          <p class="text-[11px] text-slate-400 leading-tight">Catalogue &amp; AI Styling</p>
        </div>
      </a>
      <nav class="ct-navbar flex items-center gap-1 text-xs font-medium overflow-x-auto">
        <a href="/" data-needs-wardrobe class="ct-nav px-2.5 py-1.5 rounded-lg transition whitespace-nowrap">Catalogue</a>
        <a href="/visualizer" data-needs-wardrobe class="ct-nav px-2.5 py-1.5 rounded-lg transition whitespace-nowrap">Ingestion</a>
        <a href="/styling" data-needs-wardrobe class="ct-nav px-2.5 py-1.5 rounded-lg transition whitespace-nowrap">Styling</a>
        <a href="/hopit" data-needs-wardrobe class="ct-nav px-2.5 py-1.5 rounded-lg transition whitespace-nowrap">Hopit</a>
        <a href="/pipeline-info" class="ct-nav px-2.5 py-1.5 rounded-lg transition whitespace-nowrap">Pipeline Info</a>
        <a href="/stylist" data-role-link="stylist" data-nav-characters hidden class="ct-nav px-2.5 py-1.5 rounded-lg transition whitespace-nowrap">My Characters</a>
        <a href="/admin" data-role-link="admin" hidden class="ct-nav px-2.5 py-1.5 rounded-lg transition whitespace-nowrap">Admin</a>
        <a href="/review" data-needs-wardrobe class="ct-nav px-2.5 py-1.5 rounded-lg transition whitespace-nowrap">Review</a>
        <a href="/profile" data-needs-wardrobe class="ct-nav px-2.5 py-1.5 rounded-lg transition whitespace-nowrap">Profile</a>
        <a href="/docs" target="_blank" class="ct-nav px-2.5 py-1.5 rounded-lg transition whitespace-nowrap font-semibold">API Docs ↗</a>
        <button onclick="ctLogout()" class="px-2.5 py-1.5 rounded-lg text-slate-400 hover:text-red-400 transition whitespace-nowrap">Log out</button>
      </nav>
    </div>
  </header>

  <style>
    /* The nav scrolls rather than wraps: its item count varies by role, and a wrapping bar makes
       the header taller on exactly the pages that show the extra tabs. */
    .ct-navbar { scrollbar-width: none; -ms-overflow-style: none; }
    .ct-navbar::-webkit-scrollbar { display: none; }
  </style>

  <script>
    // Active tab is derived from the URL, not hardcoded per page. Hardcoding it is exactly how
    // this navbar ended up highlighting correctly on three pages out of nine.
    (function ctMarkActiveNav() {
      var here = window.location.pathname.replace(/\/$/, "") || "/";
      document.querySelectorAll("a.ct-nav").forEach(function (el) {
        var href = el.getAttribute("href");
        if (href === "/docs" || el.target === "_blank") { el.className += " text-ct-ink-soft hover:bg-black/5"; return; }
        var path = href.replace(/\/$/, "") || "/";
        // /garment is a detail view of the catalogue, so the Catalogue tab stays lit there.
        var active = path === here || (path === "/" && here === "/garment");
        el.className += active ? " bg-ct-primary text-white" : " text-slate-400 hover:text-slate-200";
        if (active) el.setAttribute("aria-current", "page");
      });
    })();

    // Role decides both which tabs exist and what the characters tab is called: an admin sees
    // the whole roster there, so "My Characters" would be a lie.
    (async function ctGateNav() {
      try {
        var token = localStorage.getItem("ct_auth_token");
        if (!token) return;
        var res = await fetch("/api/v1/auth/me", {headers: {Authorization: "Bearer " + token}});
        if (!res.ok) return;
        var roles = (await res.json()).roles || [];
        var isAdmin = roles.indexOf("admin") !== -1;
        var isStylistOnly = roles.indexOf("stylist") !== -1 && !isAdmin;

        document.querySelectorAll("[data-role-link]").forEach(function (el) {
          var needed = el.getAttribute("data-role-link");
          if (roles.indexOf(needed) !== -1 || (needed === "stylist" && isAdmin)) el.hidden = false;
        });

        var characters = document.querySelector("[data-nav-characters]");
        if (characters && isAdmin) characters.textContent = "All Characters";

        // A stylist has no wardrobe of their own: those endpoints resolve scope from the
        // character being worked as and refuse outright when none is selected.
        var acting = "";
        try { acting = localStorage.getItem("ct_acting_persona") || ""; } catch (e) {}
        if (isStylistOnly && !acting) {
          document.querySelectorAll("[data-needs-wardrobe]").forEach(function (el) { el.hidden = true; });
        }
      } catch (e) { /* nav state is cosmetic; never break the page over it */ }
    })();
  </script>


  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <div id="content" class="grid grid-cols-1 md:grid-cols-2 gap-10">
      <div class="text-slate-500 text-sm">Loading…</div>
    </div>
  </main>

  <script>
    const API_BASE = "/api/v1/wardrobe";
    const params = new URLSearchParams(window.location.search);
    const garmentId = params.get("id");

    if (!localStorage.getItem("ct_auth_token")) window.location.href = "/login";
    // Character context: when a stylist is working on an assigned evaluation character, every
    // wardrobe and styling call is made AS that character. One header does it — the server
    // resolves the scope and the existing endpoints operate on that character's wardrobe, so
    // these pages need no other change. See app/api/dependencies.py.
    function ctActingAs() { try { return localStorage.getItem("ct_acting_persona") || ""; } catch (e) { return ""; } }
    function ctSetActingAs(personaId, name) {
      try {
        if (personaId) { localStorage.setItem("ct_acting_persona", personaId); localStorage.setItem("ct_acting_persona_name", name || personaId); }
        else { localStorage.removeItem("ct_acting_persona"); localStorage.removeItem("ct_acting_persona_name"); }
      } catch (e) {}
    }
    async function ctFetch(url, opts = {}) {
      const token = localStorage.getItem("ct_auth_token");
      const acting = ctActingAs();
      const headers = Object.assign({}, opts.headers || {},
        token ? {Authorization: `Bearer ${token}`} : {},
        acting ? {"X-Acting-As-Persona": acting} : {});
      const res = await fetch(url, Object.assign({}, opts, {headers}));
      if (res.status === 401) { localStorage.removeItem("ct_auth_token"); window.location.href = "/login"; throw new Error("Not authenticated"); }
      // A stylist with no character selected is refused by every wardrobe endpoint, by design —
      // it stops them silently ingesting into their own account. Send them to pick one rather
      // than leaving a page full of errors they cannot act on.
      if (res.status === 403 && !acting) {
        const body = await res.clone().text().catch(() => "");
        if (body.includes("act as an assigned character")) {
          window.location.href = "/stylist";
          throw new Error("Pick a character first");
        }
      }
      return res;
    }

    // A persistent reminder of whose wardrobe you are editing. Without it a stylist can easily
    // ingest forty garments into the wrong character and not find out until review.
    function ctRenderActingBanner() {
      const id = ctActingAs();
      const existing = document.getElementById("ct-acting-banner");
      if (existing) existing.remove();
      if (!id) return;
      let name = "this character";
      try { name = localStorage.getItem("ct_acting_persona_name") || name; } catch (e) {}
      const bar = document.createElement("div");
      bar.id = "ct-acting-banner";
      bar.className = "sticky top-0 z-40 bg-ct-primary text-white text-xs font-semibold px-4 py-2 flex items-center justify-center gap-3";
      bar.innerHTML = '<span>Working as <strong>' + name + '</strong> — uploads and outfits go to their wardrobe</span>' +
        '<button onclick="ctSetActingAs(null); location.reload();" class="underline underline-offset-2 hover:opacity-80">Exit</button>';
      document.body.prepend(bar);
    }
    document.addEventListener("DOMContentLoaded", ctRenderActingBanner);
    function ctLogout() { localStorage.removeItem("ct_auth_token"); window.location.href = "/login"; }

    function attrRow(label, value) {
      if (value === undefined || value === null || value === "") return "";
      const display = Array.isArray(value) ? value.join(", ") : value;
      return `<div class="flex justify-between py-1.5 border-b border-slate-800/60 text-sm">
                <span class="text-slate-500">${label}</span>
                <span class="text-slate-200 font-medium text-right">${String(display).replace(/_/g, " ")}</span>
              </div>`;
    }

    // The 28 enriched attributes (added on top of the original 16-field extraction schema) —
    // each is optional and null when not_applicable for this garment type, so only the ones
    // the extractor actually filled in are shown. Grouped for readability rather than one flat list.
    const ENRICHED_ATTRIBUTE_GROUPS = [
      ["Colour detail", [["colour_secondary_name", "Secondary colour"], ["colour_temperature", "Temperature"], ["colour_saturation", "Saturation"]]],
      ["Pattern & embellishment", [["pattern_motif", "Motif"], ["pattern_density", "Density"], ["embellishment", "Embellishment"], ["embellishment_density", "Embellishment density"], ["embellishment_placement", "Placement"]]],
      ["Fabric", [["fabric_class", "Fabric class"], ["weave_type", "Weave"], ["transparency", "Transparency"], ["sheen", "Sheen"], ["drape", "Drape"], ["stretch_grade", "Stretch"]]],
      ["Construction", [["neckline", "Neckline"], ["collar_type", "Collar"], ["sleeve_type", "Sleeve type"], ["closure_type", "Closure"], ["hem_style", "Hem style"]]],
      ["Bottoms", [["rise", "Rise"], ["leg_shape", "Leg shape"], ["waistband_style", "Waistband"]]],
      ["Category-specific", [["shoe_silhouette", "Shoe silhouette"], ["accessory_kind", "Accessory kind"]]],
      ["Styling signals", [["formality", "Formality"], ["mood_intensity", "Mood"], ["vibe_words", "Vibe"], ["wash_state_visible", "Wash state"]]],
    ];

    function enrichedAttributesSection(attrs) {
      const groupsHtml = ENRICHED_ATTRIBUTE_GROUPS.map(([groupLabel, fields]) => {
        const rows = fields.map(([key, label]) => attrRow(label, attrs[key])).join("");
        if (!rows) return "";
        return `<div class="mb-3 last:mb-0">
                  <div class="text-[10px] uppercase tracking-wider text-slate-600 font-bold mb-1">${groupLabel}</div>
                  ${rows}
                </div>`;
      }).join("");
      if (!groupsHtml) return "";
      return `<details class="bg-slate-900/70 border border-slate-800 rounded-2xl p-5 mb-6">
                <summary class="text-sm font-semibold text-slate-300 cursor-pointer select-none">Enriched attributes</summary>
                <div class="mt-3">${groupsHtml}</div>
              </details>`;
    }

    // A garment blocked as a near-duplicate names the item it duplicates, with a thumbnail and a
    // link — being told only "blocked" leaves no way to act on it.
    function duplicateBanner(g) {
      const dup = (g.provenance || {}).duplicate_of;
      if (!dup) return "";
      const pct = dup.similarity != null ? `${(dup.similarity * 100).toFixed(1)}%` : "";
      const thumb = dup.canonical_image_id
        ? `<img src="/api/v1/wardrobe/images/${dup.canonical_image_id}/bytes?thumb=160" class="w-16 h-20 object-cover rounded-lg border border-slate-700" alt="duplicate">`
        : "";
      return `
        <div class="bg-amber-500/10 border border-amber-500/40 rounded-2xl p-4 mb-6">
          <div class="flex items-start gap-3">
            ${thumb}
            <div class="flex-1">
              <div class="text-sm font-bold text-amber-600 mb-1">⚠ Blocked — duplicate of an existing garment</div>
              <p class="text-xs text-slate-500 mb-2">
                This looks like the same physical item as
                <span class="font-semibold text-ct-ink capitalize">${(dup.subcategory || "another garment").replace(/_/g, " ")}</span>
                already in your wardrobe${pct ? ` (${pct} visually identical)` : ""}. It was held for review instead of being added twice.
              </p>
              <a href="/garment?id=${encodeURIComponent(dup.garment_id)}" class="text-xs font-semibold text-ct-ink-soft hover:underline">View the garment it duplicates →</a>
            </div>
          </div>
        </div>`;
    }

    function coordinatedSection(coordinated) {
      if (!coordinated || !coordinated.length) return "";
      const items = coordinated.map(c => `
        <a href="/garment?id=${encodeURIComponent(c.garment_id)}" class="flex items-center justify-between gap-2 px-3 py-2 rounded-lg bg-slate-800/60 hover:bg-slate-800 transition text-sm">
          <span class="text-slate-200">${(c.subcategory || c.detected_label || "garment").replace(/_/g, " ")}</span>
          <span class="text-[10px] text-slate-500 font-mono">${c.status}</span>
        </a>`).join("");
      return `<div class="bg-slate-900/70 border border-slate-800 rounded-2xl p-5 mb-6">
                <div class="text-sm font-semibold text-slate-300 mb-2">Part of a co-ord set</div>
                <p class="text-xs text-slate-500 mb-3">Detected in the same photo — these were worn together and can be styled as a known-compatible set.</p>
                <div class="space-y-1.5">${items}</div>
              </div>`;
    }

    async function load() {
      const content = document.getElementById("content");
      const pipelineLink = document.getElementById("style-pipeline-link");
      if (pipelineLink && garmentId) pipelineLink.href = `/styling?anchor=${encodeURIComponent(garmentId)}`;
      if (!garmentId) {
        content.innerHTML = `<p class="text-red-400 col-span-full">No garment id provided.</p>`;
        return;
      }
      try {
        const res = await ctFetch(`${API_BASE}/garments/${encodeURIComponent(garmentId)}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const g = await res.json();
        const attrs = g.attributes || {};
        const canonicalUrl = g.canonical_image_ref ? `/api/v1/wardrobe/images/media/${g.canonical_image_ref.replace(/^object:\/\/[^/]+\//, "")}` : null;
        const cropUrl = (g.garment_crop_refs && g.garment_crop_refs[0]) ? `/api/v1/wardrobe/images/media/${g.garment_crop_refs[0].replace(/^object:\/\/[^/]+\//, "")}` : null;
        const imgUrl = canonicalUrl || cropUrl;
        const imgLabel = canonicalUrl ? null : (cropUrl ? "Raw crop — still processing (canonical image not generated yet)" : null);

        content.innerHTML = `
          <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden aspect-[3/4] relative">
            ${imgUrl ? `<img src="${imgUrl}" class="w-full h-full object-cover" alt="Garment">` : `<div class="w-full h-full flex items-center justify-center text-slate-600 text-sm">No image yet</div>`}
            ${imgLabel ? `<span class="absolute bottom-2 left-2 right-2 text-[10px] text-amber-300 bg-slate-950/80 px-2 py-1 rounded font-mono text-center">${imgLabel}</span>` : ""}
          </div>
          <div>
            <h2 class="text-3xl font-bold text-ct-ink tracking-tight capitalize mb-1.5">${((attrs.casual_name || attrs.subcategory || g.category || "Garment")).toLowerCase().replace(/_/g, " ")}</h2>
            <p class="text-sm text-slate-500 mb-6">${(attrs.subcategory || g.category || "—").replace(/_/g, " ")} · ${g.quality_status}</p>

            ${duplicateBanner(g)}

            <div class="bg-slate-900/70 border border-slate-800 rounded-2xl p-5 mb-6">
              ${attrRow("Colour", attrs.colour)}
              ${attrRow("Pattern", attrs.pattern)}
              ${attrRow("Material", attrs.material)}
              ${attrRow("Fit", attrs.fit)}
              ${attrRow("Silhouette", attrs.silhouette)}
              ${attrRow("Sleeve length", attrs.sleeve_length)}
              ${attrRow("Occasion", attrs.occasion)}
              ${attrRow("Season", attrs.season)}
              ${attrRow("Layering role", attrs.layering_role)}
              ${attrRow("Gender", attrs.gender)}
              ${attrRow("Confidence", attrs.confidence != null ? Math.round(attrs.confidence * 100) + "%" : null)}
            </div>

            ${enrichedAttributesSection(attrs)}
            ${coordinatedSection(g.coordinated_garments)}

            <div class="flex gap-2.5">
              <button id="style-btn" onclick="styleThis()" class="flex-1 px-5 py-3.5 rounded-2xl bg-ct-primary hover:bg-ct-primary-pressed text-white text-sm font-bold transition">
                ✨ Style this garment
              </button>
              <button id="retry-btn" onclick="retryPipeline()" class="px-4 py-3.5 rounded-2xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-medium transition whitespace-nowrap">
                🔄 Retry pipeline
              </button>
              <a id="style-pipeline-link" href="#" class="px-4 py-3.5 rounded-2xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-medium transition whitespace-nowrap">
                View pipeline →
              </a>
            </div>
            <div id="retry-status" class="mt-2 text-xs text-slate-500"></div>
            <div id="style-results" class="mt-6 space-y-4"></div>
          </div>`;
      } catch (e) {
        content.innerHTML = `<p class="text-red-400 col-span-full">Failed to load garment: ${e}</p>`;
      }
    }

    async function retryPipeline() {
      const btn = document.getElementById('retry-btn');
      const statusEl = document.getElementById('retry-status');
      btn.disabled = true;
      btn.innerText = '⏳ Retrying...';
      // force + resume from Stage 1: a plain retry (no force) would just re-confirm whatever
      // already "succeeded" via the idempotency check, even if that result was wrong (e.g. a
      // full-body photo that got misclassified) — force redoes the whole pipeline for real.
      statusEl.innerText = 'Re-running the full pipeline from Stage 1 (classification) — this can take a minute or two...';

      try {
        const res = await ctFetch(`${API_BASE}/garments/${encodeURIComponent(garmentId)}/retry`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ stage: "STAGE_01_CLASSIFY", force: true }),
        });
        if (!res.ok) throw new Error(await res.text());
        statusEl.innerText = 'Queued — processing in the background...';
        pollRetryStatus(0);
      } catch (e) {
        statusEl.innerText = `Retry failed to queue: ${e.message}`;
        btn.disabled = false;
        btn.innerText = '🔄 Retry pipeline';
      }
    }

    async function pollRetryStatus(attempt) {
      const statusEl = document.getElementById('retry-status');
      const btn = document.getElementById('retry-btn');
      const TERMINAL = new Set(["COMPLETED", "REVIEW_REQUIRED", "REJECTED"]);
      try {
        const res = await ctFetch(`${API_BASE}/garments/${encodeURIComponent(garmentId)}`);
        const g = await res.json();
        const status = g.quality_status || "PROCESSING";
        if (g.canonical_image_ref || TERMINAL.has(status)) {
          statusEl.innerText = `Done — ${g.quality_status}. Reloading...`;
          btn.disabled = false;
          btn.innerText = '🔄 Retry pipeline';
          load();
          return;
        }
      } catch (e) {
        // keep polling — a transient fetch error mid-retry shouldn't stop the poll loop
      }
      if (attempt < 40) {
        setTimeout(() => pollRetryStatus(attempt + 1), 4000);
      } else {
        statusEl.innerText = 'Still processing — check back shortly.';
        btn.disabled = false;
        btn.innerText = '🔄 Retry pipeline';
      }
    }

    function scoreBar(label, value) {
      const pct = Math.round((value || 0) * 100);
      return `<div class="flex items-center gap-2 text-[10px] text-slate-400">
                <span class="w-24 truncate">${label}</span>
                <div class="flex-1 h-1.5 bg-slate-800 rounded-full overflow-hidden"><div class="h-full bg-slate-600" style="width:${pct}%"></div></div>
                <span class="w-8 text-right">${pct}</span>
              </div>`;
    }

    function outfitCard(outfit) {
      const scores = outfit.scores || {};
      return `
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-ct-ink">Outfit ${outfit.rank}</span>
            <span class="text-xs font-mono font-bold text-ct-primary">${Math.round((scores.final_score || 0) * 100)}%</span>
          </div>
          ${outfit.generated_image_url ? `<img src="${outfit.generated_image_url}" class="w-full rounded-xl border border-slate-800" alt="Generated outfit">` : ""}
          <div class="flex flex-wrap gap-1.5">
            ${outfit.garments.map(g => `<a href="/garment?id=${encodeURIComponent(g.garment_id)}" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded-full transition">${(g.role || g.category || '').toLowerCase()}: ${(g.subcategory || '').replace(/_/g,' ')}</a>`).join("")}
          </div>
          <div class="space-y-1.5">
            ${scoreBar("compatibility", scores.compatibility)}
            ${scoreBar("occasion fit", scores.occasion_fit)}
          </div>
        </div>`;
    }

    async function styleThis() {
      const btn = document.getElementById("style-btn");
      const results = document.getElementById("style-results");
      btn.disabled = true;
      btn.textContent = "Styling…";
      results.innerHTML = `<p class="text-sm text-slate-500">Finding compatible pieces in your wardrobe…</p>`;
      try {
        const res = await ctFetch(`${API_BASE}/styling/recommendations`, {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({anchor_garment_ids: [garmentId], top_k: 3}),
        });
        if (!res.ok) throw new Error(await res.text());
        const data = await res.json();
        results.innerHTML = (data.outfits && data.outfits.length)
          ? data.outfits.map(outfitCard).join("")
          : `<p class="text-sm text-slate-500">No compatible outfits found for this garment yet.</p>`;
      } catch (e) {
        results.innerHTML = `<p class="text-sm text-red-400">Styling request failed: ${e}</p>`;
      } finally {
        btn.disabled = false;
        btn.textContent = "✨ Style this garment";
      }
    }

    load();
  </script>

</body>
</html>
