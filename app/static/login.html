<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — ClosetTheory</title>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
          colors: {
            slate: {
              50: '#ffffff', 100: '#000000', 200: '#000000', 300: '#262622',
              400: '#33332e', 500: '#62625b', 600: '#91918c', 700: '#c8c8c1',
              800: '#e5e5e0', 900: '#f6f6f3', 950: '#fbfbf9',
            },
            ct: {
              primary: '#e60023',
              'primary-pressed': '#cc001f',
              ink: '#000000',
              'ink-soft': '#211922',
            },
          },
        },
      },
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ct-hairline: #dadad3;
    }
    body { font-family: 'Inter', -apple-system, system-ui, sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased flex items-center justify-center px-4">

  <div class="w-full max-w-sm">
    <div class="flex items-center justify-center gap-3 mb-10">
      <div class="w-11 h-11 rounded-2xl bg-ct-primary flex items-center justify-center font-bold text-lg text-white">CT</div>
      <h1 class="text-xl font-bold text-ct-ink tracking-tight">ClosetTheory</h1>
    </div>

    <div class="bg-slate-900/70 border border-slate-800 rounded-[32px] p-8 space-y-5">
      <div class="flex rounded-2xl bg-slate-800 p-1 text-sm font-medium">
        <button id="tab-login" onclick="setMode('login')" class="flex-1 py-2 rounded-xl transition">Sign in</button>
        <button id="tab-register" onclick="setMode('register')" class="flex-1 py-2 rounded-xl transition">Create account</button>
      </div>

      <div id="register-field" class="hidden">
        <label class="text-xs font-medium text-slate-500 block mb-1.5">Display name</label>
        <input id="display-name" type="text" class="w-full bg-slate-800 border border-slate-700 rounded-2xl px-4 py-2.5 text-sm outline-none focus:border-ct-primary" placeholder="Alice">
      </div>

      <div>
        <label class="text-xs font-medium text-slate-500 block mb-1.5">Email</label>
        <input id="email" type="email" class="w-full bg-slate-800 border border-slate-700 rounded-2xl px-4 py-2.5 text-sm outline-none focus:border-ct-primary" placeholder="you@example.com">
      </div>

      <div>
        <label class="text-xs font-medium text-slate-500 block mb-1.5">Password</label>
        <input id="password" type="password" class="w-full bg-slate-800 border border-slate-700 rounded-2xl px-4 py-2.5 text-sm outline-none focus:border-ct-primary" placeholder="••••••••">
      </div>

      <button id="submit-btn" onclick="submitForm()" class="w-full bg-ct-primary hover:bg-ct-primary-pressed text-white text-sm font-bold py-3.5 rounded-2xl transition">Sign in</button>
      <p id="error-msg" class="hidden text-xs text-red-400 text-center"></p>
      <p class="text-[11px] text-slate-500 text-center pt-1">Demo account: demo@closettheory.local / demo1234</p>
    </div>
  </div>

  <script>
    let mode = "login";

    function setMode(newMode) {
      mode = newMode;
      document.getElementById("register-field").classList.toggle("hidden", mode !== "register");
      document.getElementById("submit-btn").textContent = mode === "login" ? "Sign in" : "Create account";
      document.getElementById("tab-login").classList.toggle("bg-slate-700", mode === "login");
      document.getElementById("tab-login").classList.toggle("text-ct-ink", mode === "login");
      document.getElementById("tab-register").classList.toggle("bg-slate-700", mode === "register");
      document.getElementById("tab-register").classList.toggle("text-ct-ink", mode === "register");
      document.getElementById("error-msg").classList.add("hidden");
    }

    async function submitForm() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const displayName = document.getElementById("display-name").value.trim();
      const errorEl = document.getElementById("error-msg");
      errorEl.classList.add("hidden");

      if (!email || !password || (mode === "register" && !displayName)) {
        errorEl.textContent = "Please fill in all fields.";
        errorEl.classList.remove("hidden");
        return;
      }

      const btn = document.getElementById("submit-btn");
      btn.disabled = true;
      try {
        const body = mode === "login" ? { email, password } : { email, password, display_name: displayName };
        const res = await fetch(`/api/v1/auth/${mode}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Something went wrong");
        localStorage.setItem("ct_auth_token", data.token);
        window.location.href = "/";
      } catch (e) {
        errorEl.textContent = e.message;
        errorEl.classList.remove("hidden");
      } finally {
        btn.disabled = false;
      }
    }

    setMode("login");
  </script>
</body>
</html>
